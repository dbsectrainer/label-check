name: Deploy to Hugging Face Space

# Mirrors this repository to a Hugging Face Space on every push to main, so the
# Space rebuilds its Docker image automatically.
#
# One-time setup — Settings → Secrets and variables → Actions:
#   Secret    HF_TOKEN     : a Hugging Face access token with *write* scope
#   Variable  HF_USERNAME  : your Hugging Face username or org
#   Variable  HF_SPACE     : the Space name (create the Space first, SDK: Docker)
#
# Until those are set, the workflow skips itself (no failed runs).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hf-space-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_USERNAME" ] || [ -z "$HF_SPACE" ]; then
            echo "::notice::HF deploy not configured (set HF_TOKEN secret + HF_USERNAME/HF_SPACE variables). Skipping."
            exit 0
          fi
          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" \
            HEAD:main
